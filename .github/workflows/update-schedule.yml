name: スケジュール自動更新

on:
  schedule:
    # 毎週月曜・木曜 午前3時（JST）に自動実行
    - cron: '0 18 * * 0,3'
  workflow_dispatch:
    # 手動実行ボタンも使える

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: スケジュールデータを取得・更新
        run: |
          chmod +x update-schedule.sh
          bash update-schedule.sh

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule-data.js
          if git diff --cached --quiet; then
            echo "変更なし、スキップします"
          else
            git commit -m "🔄 スケジュール自動更新 $(date '+%Y-%m-%d')"
            git push
          fi
